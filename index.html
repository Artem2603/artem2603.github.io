<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<!-- Маркер для бота: services/tunnel.py принимает адрес кнопки, только если
     страница отвечает 200 и либо весит больше 5 КБ (сам мини-ап), либо несёт
     этот маркер (вход). Не переименовывать. -->
<meta name="myllm-entry" content="2026-09-13">
<title>MyLLM</title>
<style>
  :root {
    --bg: #1c1c1e; --bg2: #2c2c2e; --text: #ffffff; --hint: #8e8e93;
    --accent: #0a84ff; --accent-text: #ffffff; --danger: #ff453a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px calc(20px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  }
  .hall { width: 100%; max-width: 360px; text-align: center; }
  .mark {
    font-size: 30px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; margin-bottom: 14px;
  }
  .mark b { color: var(--accent); font-weight: inherit; }
  .status { color: var(--hint); font-size: 15px; min-height: 1.4em; }
  .lead { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 8px; }
  .fail p { color: var(--hint); font-size: 15px; }

  /* Планка серверов: по одной «двери» на сервер. Дверь стучит, пока ждём,
     распахивается, когда сервер ответил, гаснет, если нет. */
  .doors { list-style: none; display: flex; justify-content: center; gap: 28px; margin: 26px 0 22px; }
  .door { display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 64px; color: var(--hint); }
  .glyph {
    display: block; width: 18px; height: 30px; border: 2px solid currentColor; border-radius: 4px 4px 2px 2px;
    position: relative; transform-origin: left center;
    transition: transform .4s cubic-bezier(.2,.8,.2,1), color .2s ease, opacity .2s ease;
    animation: knock 1.2s ease-in-out infinite;
  }
  .glyph::after {
    content: ""; position: absolute; right: 3px; top: 50%; width: 3px; height: 3px; margin-top: -1px;
    border-radius: 50%; background: currentColor;
  }
  .door.open { color: var(--accent); }
  .door.open .glyph { animation: none; transform: perspective(70px) rotateY(-52deg); }
  .door.fail { color: var(--danger); }
  .door.fail .glyph { animation: none; opacity: .5; }
  .name { font-size: 13px; font-weight: 600; letter-spacing: .01em; color: var(--text); }
  .door.fail .name { color: var(--hint); }
  .st { font-size: 12px; }
  @keyframes knock { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

  .btn {
    display: block; width: 100%; padding: 14px 16px; margin: 6px 0 16px;
    border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-text);
    font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn:active { opacity: .85; }
  .direct { font-size: 14px; }
  .link {
    background: none; border: 0; padding: 4px 2px; font: inherit; font-size: 14px;
    color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
  }
  .note { margin-top: 14px; font-size: 13px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    .glyph { transition: none; animation: none; opacity: .8; }
  }
</style>
</head>
<body>
<main class="hall">
  <h1 class="mark">My<b>LLM</b></h1>
  <p class="status" id="status" aria-live="polite">Подключаюсь…</p>
  <ul class="doors" id="doors" aria-label="Серверы"></ul>
  <section class="fail" id="fail" hidden>
    <h2 class="lead" id="fail-lead">Не удалось подключиться</h2>
    <p id="fail-text">Ни один сервер не ответил из вашей сети. Обычно помогает VPN: включите его и нажмите «Повторить».</p>
    <button type="button" class="btn" id="retry">Повторить</button>
    <p class="direct">Открыть без проверки: <span id="direct"></span></p>
    <p class="note">Бот в чате работает и без приложения.</p>
  </section>
</main>
<script>
(function () {
  'use strict';
  // Двери мини-аппа — те же, что в /etc/miniapp-doors.conf на апельсинке
  // (канарейка и miniapp-entry.sh сверяют список с этой страницей). Первая —
  // основная: на неё идут все, у кого нет привычной двери.
  var DOORS = [
    { name: 'zefir',  url: 'https://zefir.tail3eed13.ts.net' },
    { name: 'granat', url: 'https://granat.tail3eed13.ts.net' }
  ];
  var PROBE_TIMEOUT = 12000; // мс на ответ одной двери: первое соединение с Funnel замерено в 5-9 с,
                             // на мобильной сети будет дольше — лучше подождать, чем зря показать «не удалось»
  var ENTER_TIMEOUT = 40000; // мс на скачивание самого приложения с двери (около 700 КБ)
  var STYLE_WAIT = 6000;     // мс ждать стили приложения до запуска его скриптов
  var SLOW_HINT = 3000;      // мс до подсказки «сеть отвечает медленно»
  var WATCHDOG = 16000;      // мс до экрана «не удалось», что бы ни зависло на этапе проверки
  var STORE_KEY = 'myllm_door';

  // Как это работает. Страница НЕ уходит на дверь: она скачивает приложение с
  // открытой двери и запускает его прямо здесь, а <base href> направляет все
  // его запросы и ассеты на дверь. Адрес в WebView остаётся адресом входа:
  // Telegram ничего не перехватывает (на Android переход на другой домен из
  // Mini App открывался ещё и во встроенном браузере — без данных входа),
  // фрагмент #tgWebAppData остаётся на месте, и методы Telegram.WebApp
  // работают с origin входа даже при включённой защите.
  //
  // Почему не document.write: Chrome на медленной сети (2G по его оценке)
  // блокирует внешние скрипты, вставленные через document.write. Поэтому
  // страницу приложения разбирает DOMParser, DOM подменяется целиком, а его
  // скрипты подключаются заново по одному, в исходном порядке.
  var hash = location.hash || '';

  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function $(id) { return document.getElementById(id); }
  var entered = false;
  function setStatus(t) { if (entered) return; var el = $('status'); if (el) el.textContent = t; }

  // Цвета темы Telegram приходят в адресе; применяем только похожие на цвет.
  function applyTheme() {
    try {
      var raw = new URLSearchParams(hash.replace(/^#/, '')).get('tgWebAppThemeParams');
      if (!raw) return;
      var t = JSON.parse(raw);
      var map = {
        bg_color: '--bg', secondary_bg_color: '--bg2', text_color: '--text', hint_color: '--hint',
        button_color: '--accent', button_text_color: '--accent-text', destructive_text_color: '--danger'
      };
      var root = document.documentElement.style;
      Object.keys(map).forEach(function (k) {
        var v = t[k];
        if (typeof v === 'string' && /^#[0-9a-fA-F]{6}$/.test(v)) root.setProperty(map[k], v);
      });
    } catch (e) {}
  }

  var tiles = {}, doorState = {};
  function renderDoors() {
    var ul = $('doors');
    ul.textContent = '';
    tiles = {}; doorState = {};
    DOORS.forEach(function (d) {
      var li = document.createElement('li'); li.className = 'door';
      var glyph = document.createElement('span'); glyph.className = 'glyph'; glyph.setAttribute('aria-hidden', 'true');
      var name = document.createElement('span'); name.className = 'name'; name.textContent = d.name;
      var st = document.createElement('span'); st.className = 'st'; st.textContent = 'жду…';
      li.appendChild(glyph); li.appendChild(name); li.appendChild(st);
      ul.appendChild(li);
      tiles[d.name] = { li: li, st: st };
      doorState[d.name] = 'wait';
    });
  }
  function mark(d, state, text) {
    if (entered) return;
    doorState[d.name] = state;
    var t = tiles[d.name];
    if (!t) return;
    t.li.className = 'door ' + state;
    t.st.textContent = text;
  }
  function describe(err) {
    if (err && err.name === 'AbortError') return 'таймаут';
    if (err && err.http) return 'HTTP ' + err.http;
    if (err && err.notApp) return 'не приложение';
    return 'нет ответа';
  }

  // Одна дверь: 200 на /readyz — открыта. Не 2xx, переадресация, обрыв или
  // молчание дольше PROBE_TIMEOUT — закрыта. Дверь отдаёт CORS для этого
  // origin (MYLLM_EXTRA_CORS_ORIGINS в .env бота), иначе ответ не прочитать.
  function probe(d) {
    var ac = new AbortController();
    var timer = setTimeout(function () { ac.abort(); }, PROBE_TIMEOUT);
    return fetch(d.url + '/readyz', { cache: 'no-store', credentials: 'omit', redirect: 'error', signal: ac.signal })
      .then(function (r) {
        if (!r.ok) { var e = new Error('HTTP ' + r.status); e.http = r.status; throw e; }
        return d;
      })
      .then(
        function (ok) { clearTimeout(timer); mark(d, 'open', 'открыта'); return ok; },
        function (err) { clearTimeout(timer); mark(d, 'fail', describe(err)); throw err; }
      );
  }

  // Первый успешный из списка; отказ со списком ошибок — когда отказали все
  // (без Promise.any: старые WebView его не знают).
  function anyOf(promises) {
    return new Promise(function (resolve, reject) {
      var left = promises.length, errors = [];
      if (!left) { reject(errors); return; }
      promises.forEach(function (p, i) {
        p.then(resolve, function (e) { errors[i] = e; if (--left === 0) reject(errors); });
      });
    });
  }

  // Привычная дверь — та, что открылась в прошлый раз; на первый раз —
  // основная. Ждём ЕЁ исход (не дольше PROBE_TIMEOUT), даже если другая
  // ответила раньше: все ходят в одну дверь, пока она открыта. Только если
  // она закрыта — первая из остальных, что ответила.
  function pick() {
    var pref = load(STORE_KEY) || DOORS[0].name;
    var probes = DOORS.map(probe);
    var i = 0;
    DOORS.forEach(function (d, k) { if (d.name === pref) i = k; });
    return probes[i].then(function (d) { return d; }, function () { return anyOf(probes); });
  }

  // Скачать само приложение с двери. Проверяем, что это оно (а не страница
  // ошибки Funnel с кодом 200): полноценный html с подключённым SDK Telegram.
  function fetchApp(d) {
    var ac = new AbortController();
    var timer = setTimeout(function () { ac.abort(); }, ENTER_TIMEOUT);
    return fetch(d.url + '/', { credentials: 'omit', redirect: 'error', signal: ac.signal })
      .then(function (r) {
        if (!r.ok) { var e = new Error('HTTP ' + r.status); e.http = r.status; throw e; }
        return r.text();
      })
      .then(
        function (html) {
          clearTimeout(timer);
          if (!/<html[\s>]/i.test(html) || html.indexOf('telegram-web-app.js') < 0) {
            var e2 = new Error('not-app'); e2.notApp = true; throw e2;
          }
          return html;
        },
        function (err) { clearTimeout(timer); throw err; }
      );
  }

  var slowTimer = null, watchdog = null;
  function stopTimers() { clearTimeout(slowTimer); clearTimeout(watchdog); }

  // Ждём стили приложения (как парсер ждёт их перед скриптами), но не вечно.
  function waitStyles(links) {
    return new Promise(function (resolve) {
      var left = links.length, done = false;
      function one() { if (!done && --left <= 0) { done = true; resolve(); } }
      if (!left) { resolve(); return; }
      links.forEach(function (l) {
        if (l.sheet) { one(); return; }
        l.addEventListener('load', one); l.addEventListener('error', one);
      });
      setTimeout(function () { if (!done) { done = true; resolve(); } }, STYLE_WAIT);
    });
  }

  // Скрипты приложения по одному, в исходном порядке: внешний — ждём загрузки,
  // встроенный — выполняется сразу при вставке. Атрибуты переносим как есть.
  function runScripts(list, i) {
    if (i >= list.length) return;
    var s = list[i];
    var n = document.createElement('script');
    Array.prototype.slice.call(s.attributes).forEach(function (a) { n.setAttribute(a.name, a.value); });
    if (s.hasAttribute('src')) {
      n.async = false;
      n.onload = n.onerror = function () { runScripts(list, i + 1); };
      document.head.appendChild(n);
    } else {
      n.textContent = s.textContent;
      document.head.appendChild(n);
      runScripts(list, i + 1);
    }
  }

  // Запуск приложения здесь же: тот же Window (мост Telegram, location с
  // фрагментом, localStorage origin'а входа), другой DOM.
  function enter(d) {
    mark(d, 'open', 'загружаю…');
    setStatus('Загружаю приложение с ' + d.name + '…');
    return fetchApp(d).then(function (html) {
      save(STORE_KEY, d.name);
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var base = doc.createElement('base');
      base.setAttribute('href', d.url + '/');
      doc.head.insertBefore(base, doc.head.firstChild);
      // Скрипты вынимаем из разобранного документа: вставленные готовым DOM
      // они не выполняются, а нам нужен исходный порядок.
      var scripts = Array.prototype.slice.call(doc.querySelectorAll('script'));
      scripts.forEach(function (s) { s.parentNode.removeChild(s); });
      // Внешние скрипты скачиваем заранее, параллельно; выполним по порядку.
      scripts.forEach(function (s) {
        if (!s.hasAttribute('src')) return;
        var pre = doc.createElement('link');
        pre.setAttribute('rel', 'preload'); pre.setAttribute('as', 'script');
        pre.setAttribute('href', s.getAttribute('src'));
        doc.head.appendChild(pre);
      });
      entered = true;
      stopTimers();
      var html2 = document.adoptNode(doc.documentElement);
      document.replaceChild(html2, document.documentElement);
      var links = Array.prototype.slice.call(document.querySelectorAll('link[rel="stylesheet"]'));
      return waitStyles(links).then(function () { runScripts(scripts, 0); });
    });
  }

  // По очереди: привычная дверь, потом остальные открытые, потом непроверенные.
  // Закрытые (сбой пробы) не трогаем — там нечего качать.
  function enterAny(list, i, errs) {
    if (i >= list.length) return Promise.reject(errs);
    var d = list[i];
    if (doorState[d.name] === 'fail') return enterAny(list, i + 1, errs);
    return enter(d).catch(function (e) {
      if (entered) throw e;  // DOM уже подменён — назад дороги нет
      errs.push(e);
      mark(d, 'fail', describe(e));
      return enterAny(list, i + 1, errs);
    });
  }

  function showFail(errs, lead) {
    if (entered) return;
    setStatus('');
    // Сервер ответил, но не готов (503, не приложение) — это не сеть, VPN не поможет.
    var server = false;
    (errs || []).forEach(function (e) { if (e && (e.http || e.notApp)) server = true; });
    $('fail-lead').textContent = lead || (server ? 'Сервер не готов' : 'Не удалось подключиться');
    $('fail-text').textContent = server
      ? 'Серверы отвечают, но приложение сейчас не готово. Подождите минуту и нажмите «Повторить».'
      : 'Ни один сервер не ответил из вашей сети. Обычно помогает VPN: включите его и нажмите «Повторить».';
    var box = $('direct');
    box.textContent = '';
    DOORS.forEach(function (d, i) {
      if (i) box.appendChild(document.createTextNode(' · '));
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'link'; b.textContent = d.name;
      b.addEventListener('click', function () {
        $('fail').hidden = true;
        doorState[d.name] = 'wait';
        enter(d).catch(function (e) { showFail([e], 'Не получилось открыть ' + d.name); });
      });
      box.appendChild(b);
    });
    $('fail').hidden = false;
  }

  function run() {
    $('fail').hidden = true;
    setStatus('Подключаюсь…');
    renderDoors();
    stopTimers();
    var finished = false;
    function finish(fn) { if (finished) return; finished = true; stopTimers(); fn(); }
    slowTimer = setTimeout(function () { setStatus('Сеть отвечает медленно — ещё немного…'); }, SLOW_HINT);
    watchdog = setTimeout(function () { finish(function () { showFail([]); }); }, WATCHDOG);
    pick().then(
      function (d) {
        finish(function () {
          var order = [d].concat(DOORS.filter(function (x) { return x !== d && doorState[x.name] === 'open'; }))
                         .concat(DOORS.filter(function (x) { return x !== d && doorState[x.name] === 'wait'; }));
          enterAny(order, 0, []).catch(function (errs) { showFail(errs); });
        });
      },
      function (errs) { finish(function () { showFail(errs); }); }
    );
  }

  applyTheme();
  $('retry').addEventListener('click', run);
  run();
})();
</script>
</body>
</html>
